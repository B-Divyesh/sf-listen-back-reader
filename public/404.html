<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f1e3" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Listen Back Reader</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color: #17212b; background: #f7f1e3; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; font-size: 18px; line-height: 1.55; }
      a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 2px; }
      a:focus-visible { outline: 3px solid #ad6400; outline-offset: 4px; }
      .skip { position: absolute; top: -60px; left: 12px; padding: 9px 14px; background: #17212b; color: #f7f1e3; }
      .skip:focus { top: 12px; }
      header, footer { padding: 22px max(24px, calc((100vw - 1180px) / 2)); }
      header { border-bottom: 2px solid #17212b; font: bold 22px Georgia, serif; }
      main { min-height: 62vh; max-width: 800px; margin: auto; padding: 72px 24px; }
      .kicker { margin: 0 0 12px; color: #075985; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 0 0 22px; font: 700 clamp(42px, 7vw, 66px) / .98 Georgia, serif; letter-spacing: -.045em; }
      .primary { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 10px 16px; border: 2px solid #c2410c; border-radius: 9px; background: #c2410c; box-shadow: 4px 4px 0 #17212b; color: #fff8ee; font-weight: 800; text-decoration: none; }
      footer { background: #101a24; color: #f7f1e3; font-size: 14px; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header><a href="/">◉ Listen Back</a></header>
    <main id="main">
      <p class="kicker">Ink lost its line</p>
      <h1>This page is not in the reader.</h1>
      <p>Go back to the place where the sentence starts.</p>
      <a class="primary" href="/">Go to home</a>
    </main>
    <footer>Replay one sentence without losing your place.</footer>
  </body>
</html>
